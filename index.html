<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tokenize anything that goes viral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Sora',system-ui,sans-serif;
    min-height:100vh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;
    padding:40px 24px;
    background:#04120c;
    color:#eafff4;
    overflow-x:hidden;
  }
  #bgvid{
    position:fixed;inset:0;width:100%;height:100%;
    object-fit:cover;z-index:-2;
    background:#04120c;
  }
  .overlay{
    position:fixed;inset:0;z-index:-1;
    background:radial-gradient(120% 90% at 50% 40%, rgba(4,18,12,.05), rgba(4,18,12,.4) 78%);
  }
  .wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
  h1{
    font-weight:800;
    font-size:clamp(38px,7.5vw,94px);
    line-height:1.04;
    letter-spacing:-.03em;
    text-shadow:0 0 60px rgba(18,255,160,.35);
    max-width:15ch;
  }
  h1 .g{
    background:linear-gradient(92deg,#eafff4,#12ffa0 55%,#0a8f5c);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .icons{
    margin-top:64px;
    display:flex;flex-wrap:wrap;gap:34px;justify-content:center;align-items:center;
  }
  .icons img{
    width:88px;height:88px;object-fit:contain;
    filter:drop-shadow(0 8px 26px rgba(18,255,160,.4));
    animation:float 6s ease-in-out infinite;
  }
  .icons img:nth-child(2){animation-delay:-1.4s}
  .icons img:nth-child(3){animation-delay:-2.8s}
  .icons img:nth-child(4){animation-delay:-4.2s}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  @media(prefers-reduced-motion:reduce){.icons img{animation:none}}
  @media(max-width:600px){.icons img{width:60px;height:60px}.icons{gap:22px}}
</style>
