<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tokenize anything that goes viral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aguafina+Script&family=Alexandria:wght@600&family=Afacad:wght@700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Alexandria',system-ui,sans-serif;
    min-height:100vh;position:relative;color:#fff;overflow-x:hidden;
    cursor:none;
  }
  #bgvid{
    position:fixed;inset:0;width:100%;height:100%;
    object-fit:cover;z-index:-2;background:#04120c;
  }
  .overlay{
    position:fixed;inset:0;z-index:-1;
    background:linear-gradient(180deg, rgba(4,18,12,.18), rgba(4,18,12,.12) 40%, rgba(4,18,12,.22));
  }

  /* trail canvas */
  #trail{
    position:fixed;inset:0;z-index:9998;pointer-events:none;
    mix-blend-mode:screen;
  }
  .glow{
    position:fixed;top:0;left:0;width:26px;height:26px;pointer-events:none;
    z-index:9999;border-radius:50%;transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(18,255,160,.9), rgba(18,255,160,.15) 55%, transparent 70%);
    mix-blend-mode:screen;
    transition:width .25s ease,height .25s ease;
  }
  .glow.active{width:46px;height:46px}
  @media(hover:none){#trail,.glow{display:none}body{cursor:auto}}

  /* top badges */
  .topbar{
    position:absolute;top:38px;left:50%;transform:translateX(-50%);
    display:flex;gap:14px;align-items:center;z-index:5;
    opacity:0;animation:dropIn .8s .2s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .badge-star{
    width:110px;height:72px;border-radius:22px;
    background:#0a0d0b;
    display:flex;align-items:center;justify-content:center;
  }
  .badge-star img{width:64px;height:64px;object-fit:contain;display:block}
  .badge-soon{
    height:72px;padding:0 36px;border-radius:22px;background:#0a0d0b;
    display:flex;align-items:center;
    font-family:'Afacad',sans-serif;font-weight:700;
    letter-spacing:.10em;font-size:28px;
  }

  /* hero */
  .hero{
    position:relative;z-index:2;min-height:100vh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;padding:40px 24px;
  }
  .script{
    font-family:'Aguafina Script',cursive;font-weight:400;
    font-size:clamp(120px,25vw,380px);line-height:.82;
    text-shadow:0 6px 44px rgba(0,0,0,.45);
    opacity:0;animation:riseIn 1.1s .5s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .tagline{
    font-family:'Alexandria',sans-serif;font-weight:600;
    font-size:clamp(20px,3.6vw,54px);letter-spacing:.005em;
    margin-top:-.85em;position:relative;z-index:3;
    text-shadow:0 4px 32px rgba(0,0,0,.55);
    opacity:0;animation:riseIn 1.1s .9s cubic-bezier(.2,.8,.2,1) forwards;
  }

  /* floating icons - bigger */
  .float-icon{
    position:absolute;z-index:1;object-fit:contain;
    filter:drop-shadow(0 8px 30px rgba(0,0,0,.55));
    opacity:0;
    animation:popIn .7s cubic-bezier(.2,1.4,.4,1) forwards, float 7s ease-in-out infinite;
  }
  .fi-ig{width:120px;height:120px;top:24%;left:13%;animation-delay:1.2s,1.9s}
  .fi-x {width:112px;height:112px;top:46%;right:11%;animation-delay:1.35s,2.05s}
  .fi-x-link{display:contents}
  .fi-gh{width:124px;height:124px;bottom:22%;left:21%;animation-delay:1.5s,2.2s}
  .fi-tt{width:120px;height:120px;bottom:17%;right:15%;animation-delay:1.65s,2.35s}

  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
  @keyframes riseIn{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
  @keyframes dropIn{from{opacity:0;transform:translateX(-50%) translateY(-24px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  @keyframes popIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}

  @media(prefers-reduced-motion:reduce){
    .float-icon,.script,.tagline,.topbar{animation:none;opacity:1}
  }

  @media(max-width:820px){
    .fi-ig{width:64px;height:64px;top:18%;left:6%}
    .fi-x {width:60px;height:60px;top:44%;right:5%}
    .fi-gh{width:66px;height:66px;bottom:22%;left:8%}
    .fi-tt{width:64px;height:64px;bottom:14%;right:7%}
    .badge-soon{font-size:20px;height:50px;padding:0 22px}
    .badge-star{width:76px;height:50px}
    .badge-star img{width:54px;height:54px}
  }
</style>
</head>

  <div class="hero">
    <div class="script">Tokenize</div>
    <div class="tagline">Anything That Goes Virl</div>
  </div>

<script>
  const glow=document.getElementById('glow');
  const cv=document.getElementById('trail');
  const ctx=cv.getContext('2d');
  function resize(){cv.width=innerWidth;cv.height=innerHeight;}
  resize(); addEventListener('resize',resize);

  let mx=innerWidth/2,my=innerHeight/2,lastx=mx,lasty=my,hasMoved=false;
  const points=[]; // drawing trail segments {x1,y1,x2,y2,life}

  addEventListener('mousemove',e=>{
    mx=e.clientX;my=e.clientY;
    glow.style.left=mx+'px';glow.style.top=my+'px';
    if(hasMoved){
      points.push({x1:lastx,y1:lasty,x2:mx,y2:my,life:1});
    }
    lastx=mx;lasty=my;hasMoved=true;
  });

  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.lineCap='round';ctx.lineJoin='round';
    for(let i=points.length-1;i>=0;i--){
      const p=points[i];
      p.life-=0.02;
      if(p.life<=0){points.splice(i,1);continue;}
      ctx.strokeStyle='rgba(18,255,160,'+(p.life*0.85)+')';
      ctx.shadowColor='rgba(18,255,160,'+(p.life)+')';
      ctx.shadowBlur=16;
      ctx.lineWidth=6*p.life+1;
      ctx.beginPath();
      ctx.moveTo(p.x1,p.y1);
      ctx.lineTo(p.x2,p.y2);
      ctx.stroke();
    }
    requestAnimationFrame(draw);
  }
  draw();

  document.querySelectorAll('.float-icon,.badge-soon,.badge-star').forEach(el=>{
    el.addEventListener('mouseenter',()=>glow.classList.add('active'));
    el.addEventListener('mouseleave',()=>glow.classList.remove('active'));
  });
</script>
